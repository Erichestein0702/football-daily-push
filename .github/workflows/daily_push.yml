name: ⚽ 每日足球推送

on:
  schedule:
    # 每天北京时间 08:00（UTC 00:00）执行
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "抓取指定日期（YYYY-MM-DD，北京时间），留空则使用当天"
        required: false
        type: string

# 需要向仓库写回日报文件
permissions:
  contents: write

# 避免定时任务与手动触发并发写入
concurrency:
  group: football-daily-push
  cancel-in-progress: false

jobs:
  push:
    name: 抓取并推送足球日报
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史以便 rebase 后推送
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python fetch_football.py --date "$TARGET_DATE"
          else
            python fetch_football.py
          fi

      - name: Push to WeChat via PushPlus
        # secrets 上下文在 if 中不可直接引用，这里通过 env 判断
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "未配置 PUSHPLUS_TOKEN，跳过微信推送"
            exit 0
          fi
          python notify_pushplus.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add football_daily.md football_data.json
          if git diff --cached --quiet; then
            echo "日报内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "📅 自动更新 $(date -u +%Y%m%d) 足球日报"
          git pull --rebase origin main
          git push origin HEAD:main
