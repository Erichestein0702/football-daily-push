name: ⚽ 每日足球推送

on:
  schedule:
    # 每天北京时间 08:00（UTC 00:00）执行
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "抓取指定日期（YYYY-MM-DD，北京时间），留空则使用当天"
        required: false
        type: string

# 需要向仓库写回日报文件，并创建/评论 issue 触发 GitHub 邮件通知
permissions:
  contents: write
  issues: write

# 避免定时任务与手动触发并发写入
concurrency:
  group: football-daily-push
  cancel-in-progress: false

jobs:
  push:
    name: 抓取并推送足球日报
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史以便 rebase 后推送
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python fetch_football.py --date "$TARGET_DATE"
          else
            python fetch_football.py
          fi

      - name: Publish daily report to GitHub Issue (email notification)
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="⚽ 足球日报 $(python -c "import json;print(json.load(open('football_data.json'))['date'])")"
          EXISTING=$(gh issue list --state open --limit 200 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$EXISTING" ]; then
            echo "更新已有 issue #$EXISTING（同日重复触发）"
            gh issue comment "$EXISTING" --body-file football_daily.md
          else
            echo "创建 issue 并指派给 $GITHUB_REPOSITORY_OWNER；GitHub 会按账号通知设置发送邮件到绑定邮箱"
            gh issue create \
              --title "$TITLE" \
              --body-file football_daily.md \
              --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## ⚽ 足球日报"
            echo ""
            if [ -f football_daily.md ]; then cat football_daily.md; else echo "（未生成日报）"; fi
            echo ""
            echo "> 推送存档：\`push_payload.json\`（不含 token）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-daily-report
          path: |
            football_daily.md
            football_data.json
          if-no-files-found: warn

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add football_daily.md football_data.json
          if git diff --cached --quiet; then
            echo "日报内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "📅 自动更新 $(date -u +%Y%m%d) 足球日报"
          git pull --rebase origin main
          git push origin HEAD:main
